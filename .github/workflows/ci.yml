name: IndieVault CI/CD Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compile Java Application & Unit Tests
        run: javac IndieVault.java IndieVaultTest.java

      - name: Run Automated Unit Tests
        run: java IndieVaultTest

      - name: Run Smoke Test on Server
        run: |
          java IndieVault &
          SERVER_PID=$!
          sleep 3
          curl -f http://localhost:8080/api/health
          curl -f http://localhost:8080/api/films
          kill $SERVER_PID
