<style>

.btn:hover{border-color:var(--gold)}.btn.p{background:var(--gold);color:#16120a;border-color:var(--gold)}.btn.p:hover{filter:brightness(1.1)}.btn.d{border-color:var(--crim);color:#e58b97}.btn.s{padding:5px 11px;font-size:13px}
input,select,textarea{background:#100f0e;border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
label{display:block;color:var(--mu);font-size:13px;margin:12px 0 4px}
.menu{display:none}.dd{position:relative}.ddc{position:absolute;right:0;top:110%;background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:230px;padding:8px;display:none}.dd.open .ddc{display:block}.ddc a,.ddc div{display:block;padding:8px 10px;border-radius:8px;font-size:14px}.ddc a:hover{background:#221f1c}

.hero{position:relative;min-height:70vh;display:flex;align-items:flex-end;padding:6vw 4vw;overflow:hidden;background:linear-gradient(120deg,hsl(var(--h) 40% 16%),#0d0c0b 70%)}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 78% 30%,hsl(var(--h) 60% 30% / .5),transparent 45%),linear-gradient(0deg,var(--bg),transparent 55%)}
.hero>*{position:relative}.hero .in{max-width:640px;animation:fi .6s}.hero h1{font-size:clamp(34px,6vw,64px);letter-spacing:-1.5px;margin:10px 0}
.hero .pz{position:absolute;right:6vw;top:12vh;width:min(26vw,260px)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--mu);font-size:13px;align-items:center}.star{color:var(--gold)}
.hn{position:absolute!important;bottom:18px;right:4vw;display:flex;gap:8px;align-items:center}.dot{width:8px;height:8px;border-radius:9px;background:#555;border:0;padding:0;cursor:pointer}.dot.on{background:var(--gold);width:22px}
@keyframes fi{from{opacity:0;transform:translateY(14px)}}
.row{margin:30px 0}.row h2{font-size:21px;margin-bottom:12px}.sc{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
.card{flex:0 0 190px;scroll-snap-align:start;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:.25s}.card:hover{transform:translateY(-4px);border-color:#4a4036}.grid .card{flex:auto}
.poster{position:relative;aspect-ratio:2/3;display:flex;align-items:flex-end;padding:12px;overflow:hidden;background:linear-gradient(165deg,hsl(var(--h) 45% 26%),hsl(calc(var(--h) + 40) 50% 7%))}
.poster::after{content:"";position:absolute;width:140%;aspect-ratio:1;border-radius:50%;border:1px solid #ffffff22;top:-30%;left:-20%;box-shadow:0 0 0 24px #ffffff08,0 0 0 52px #ffffff05}
.poster b{position:relative;z-index:1;font-size:17px;line-height:1.1;letter-spacing:-.4px;text-shadow:0 2px 12px #000}
.poster .rt{position:absolute;top:8px;left:8px;z-index:2;background:#000a;padding:2px 8px;border-radius:9px;font-size:12px}
.cb{padding:10px 12px}.cb .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ca{display:flex;gap:6px;margin-top:8px}.ca .btn{flex:1;justify-content:center;padding:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.chip{background:#2a2118;border:1px solid #4a3a22;color:var(--gold);padding:3px 10px;border-radius:99px;font-size:13px;cursor:pointer}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.two{display:grid;grid-template-columns:260px 1fr;gap:30px}.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.stat b{display:block;font-size:24px;color:var(--gold)}.stat span{color:var(--mu);font-size:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}.tabs a{padding:7px 14px;border-radius:99px;border:1px solid var(--line);color:var(--mu)}.tabs a.on{background:var(--gold);color:#16120a;border-color:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}th{color:var(--mu);font-weight:500}.tw{overflow-x:auto}
.tag{font-size:12px;padding:2px 9px;border-radius:9px;background:#26221e}.tag.published{color:#8fcf9f}.tag.pending{color:var(--gold)}.tag.rejected,.tag.suspended{color:#e58b97}
.player{background:#000;border-radius:14px;overflow:hidden;border:1px solid var(--line)}.screen{aspect-ratio:16/9;display:grid;place-items:center;text-align:center;background:radial-gradient(circle,hsl(var(--h) 50% 22%),#050505 75%);position:relative}
.screen h2{font-size:clamp(20px,4vw,40px);opacity:.9}.sub{position:absolute;bottom:8%;left:0;right:0;font-size:clamp(13px,2vw,19px);text-shadow:0 2px 6px #000}
.ctl{display:flex;gap:10px;align-items:center;padding:10px;flex-wrap:wrap;background:#0e0d0c}.ctl input[type=range]{padding:0;width:auto;flex:1;min-width:100px;accent-color:var(--gold)}.ctl select{width:auto;padding:5px}
.modal{position:fixed;inset:0;background:#000c;z-index:50;display:grid;place-items:center;padding:16px}.mc{background:var(--bg);border:1px solid var(--line);border-radius:16px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:18px}
.toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:99;display:grid;gap:8px}.toast{background:var(--gold);color:#16120a;padding:10px 18px;border-radius:99px;font-weight:700;animation:fi .3s}
.demo{background:#2a1418;border:1px solid var(--crim);color:#f0b0b8;padding:8px 12px;border-radius:10px;font-size:13px}
.stars button{background:none;border:0;font-size:24px;color:#555;cursor:pointer;padding:0 2px}.stars button.on{color:var(--gold)}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px}.bars div{flex:1;background:linear-gradient(var(--gold),#7a5a1c);border-radius:5px 5px 0 0;position:relative;min-height:2px}.bars i{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:11px;color:var(--mu);font-style:normal}
.err{color:#e58b97;font-size:13px;min-height:16px}.emp{text-align:center;color:var(--mu);padding:40px}
footer{border-top:1px solid var(--line);padding:24px 4vw;color:var(--mu);font-size:13px}
@media(max-width:820px){.links{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;background:var(--bg);padding:14px 4vw;margin:0;border-bottom:1px solid var(--line)}.links.open{display:flex}.menu{display:inline-flex}.two{grid-template-columns:1fr}.hero .pz{display:none}.card{flex-basis:150px}.sp{display:none}nav{gap:10px}.nr{margin-left:auto}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<nav><button class="btn menu s" id="mb" aria-label="Menu">Menu</button>
<a class="logo" href="#/"><svg width="30" height="30" viewBox="0 0 32 32" fill="none" stroke="#d9a441" stroke-width="2"><circle cx="16" cy="16" r="13"/><circle cx="16" cy="16" r="8.5" stroke="#8f2d3a"/><path d="M13.5 11.5v9l7-4.5z" fill="#d9a441" stroke="none"/><path d="M16 3v3M16 26v3M3 16h3M26 16h3"/></svg>Indie<b>Vault</b></a>
<div class="links" id="lk"><a href="#/">Home</a><a href="#/explore">Explore Films</a><a href="#/explore/Short">Short Films</a><a href="#/explore/Documentary">Documentaries</a><a href="#/explore/Regional">Regional Cinema</a><a href="#/dash/watch">Watchlist</a></div>

<script>
const $=s=>document.querySelector(s),H=(s,h)=>{$(s).innerHTML=h};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr=n=>'₹'+(Math.round(n*100)/100),HR=36e5,now=()=>Date.now();
const ST={get:()=>{try{return JSON.parse(localStorage.getItem('iv2'))}catch(e){return null}},set:d=>{try{localStorage.setItem('iv2',JSON.stringify(d))}catch(e){}}};
const GEN=['Drama','Thriller','Romance','Documentary','Experimental','Comedy','Family'],CAT=['Short','Documentary','Regional','Student','Feature'];
function seed(){const R=`The Last Ferry|Rohan Desai|2025|22|Gujarati|Drama|Regional|49|4.6|9200|20
Monsoon Ledger|Anika Rao|2024|18|Hindi|Thriller|Short|29|4.4|7100|350
Salt & Silence|Meera Joshi|2025|34|Gujarati|Documentary|Documentary|79|4.8|12400|190
Paper Boats|Kabir Nair|2023|27|Malayalam|Drama|Regional|49|4.5|5300|205
Kolam|Divya Sundar|2024|31|Tamil|Romance|Regional|79|4.3|6100|320
Third Floor Window|Aarav Mehta|2025|14|Hindi|Experimental|Student|29|4.1|3100|270
Dust Roads|Imran Qureshi|2022|52|Hindi|Documentary|Documentary|99|4.7|8800|35
Night Shift Chai|Sneha Kulkarni|2025|12|Hindi|Comedy|Student|29|4.0|4200|45
The Weaver's Daughter|Hetal Parmar|2024|25|Gujarati|Drama|Short|49|4.6|6900|15
Static|Nikhil Varma|2023|19|English|Thriller|Short|29|4.2|2500|230
Backwaters|Anjali Menon|2024|44|Malayalam|Romance|Regional|79|4.5|5800|175
Ink on Water|Farhan Ali|2025|16|Hindi|Experimental|Student|29|3.9|1900|300
Rooftop Radio|Pooja Iyer|2024|23|Tamil|Comedy|Short|49|4.2|3700|55
Where the River Bends|Jignesh Shah|2023|58|Gujarati|Documentary|Documentary|99|4.8|10100|160
Lantern Season|Mira Das|2025|29|Hindi|Family|Feature|79|4.4|4400|30
Cold Station|Rahul Bhatt|2022|41|Hindi|Thriller|Feature|99|4.3|7600|345`.split('\n');
const mk=[2,4];const films=R.map((r,i)=>{const x=r.split('|');return{id:i+1,title:x[0],director:x[1],year:+x[2],runtime:+x[3],language:x[4],genre:x[5],cat:x[6],price:+x[7],rating:+x[8],views:+x[9],hue:+x[10],maker:i%2?4:2,status:'published',featured:i<4,cast:['Ira Kapoor','Dev Anand Rao','Leela Fernandes'],cine:'Tara Bhosle',editor:'Sameer Dutt',subs:['English','Hindi'],age:i%5==0?'U/A 13+':'U',awards:i%3==0?['Best Short – Kutch Indie Fest 2025']:i%3==1?[]:['Audience Choice – Gandhinagar Film Week'],bts:'Shot over 11 days on location with a crew of eight and natural light.',synopsis:'A quiet, human story set in a place the camera rarely visits. '+x[0]+' follows ordinary people at a turning point, told with patience and restraint.',tags:[x[5].toLowerCase(),x[4].toLowerCase()],created:now()-i*864e5*3}});
const pw=p=>btoa(p);const users=[{id:1,name:'Viewer Demo',email:'viewer@demo.com',pw:pw('demo123'),role:'viewer'},{id:2,name:'Aarav Mehta',email:'maker@demo.com',pw:pw('demo123'),role:'filmmaker',bio:'Ahmedabad-based director making small films about big neighbourhoods.',loc:'Ahmedabad, India',social:'instagram.com/aaravmehta'},{id:3,name:'Admin Demo',email:'admin@demo.com',pw:pw('demo123'),role:'admin'},{id:4,name:'Meera Joshi',email:'meera@demo.com',pw:pw('demo123'),role:'filmmaker',bio:'Documentary filmmaker from Bhuj documenting craft and salt.',loc:'Bhuj, India',social:'instagram.com/meerajoshi'}];
return{me:null,users,films,genres:[...GEN],cats:[...CAT],rentals:[],pays:[],tips:[],reviews:[],watch:[],hist:{},follows:[{u:1,m:2}],notes:[],nid:100}}
let D=ST.get()||seed();const save=()=>ST.set(D);
const me=()=>D.users.find(u=>u.id==D.me),U=id=>D.users.find(u=>u.id==id)||{name:'Unknown'},F=id=>D.films.find(f=>f.id==id);
const pub=()=>D.films.filter(f=>f.status=='published');
const rv=id=>D.reviews.filter(r=>r.f==id);
const rate=f=>{const r=rv(f.id);return r.length?((f.rating*20+r.reduce((a,b)=>a+b.s,0))/(20+r.length)):f.rating};
const notify=(u,m)=>{D.notes.unshift({id:D.nid++,u,m,ts:now(),read:0})};
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;$('#ts').append(t);setTimeout(()=>t.remove(),3000)};
const rental=(fid)=>{const u=me();return u&&D.rentals.filter(r=>r.u==u.id&&r.f==fid).sort((a,b)=>b.exp-a.exp)[0]};
const active=fid=>{const r=rental(fid);return r&&r.exp>now()?r:null};
const left=ms=>{const m=Math.max(0,Math.floor(ms/6e4));return Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m'};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s%60).padStart(2,'0')};
const need=role=>{const u=me();if(!u){location.hash='#/login';toast('Log in to continue');return 0}if(u.status=='suspended'){toast('Your account is suspended');location.hash='#/';return 0}if(role&&!role.split(',').includes(u.role)){toast('You do not have access to that page');location.hash='#/';return 0}return u};
let timers=[];const clear=()=>{timers.forEach(clearInterval);timers=[];stopAudio()};
/* ---------- components ---------- */
const poster=(f,rt)=>`<div class="poster" style="--h:${f.hue}">${rt?`<span class="rt"><span class="star">★</span> ${rate(f).toFixed(1)}</span>`:''}<b>${esc(f.title)}</b></div>`;
const stars=n=>'★'.repeat(Math.round(n))+'☆'.repeat(5-Math.round(n));
function card(f){const w=me()&&D.watch.some(x=>x.u==D.me&&x.f==f.id);return`<div class="card"><a href="#/film/${f.id}" aria-label="${esc(f.title)}">${poster(f,1)}</a><div class="cb"><div class="t">${esc(f.title)}</div><div class="meta">${f.year} · ${f.genre} · ${f.language} · ${f.runtime}m</div><div class="meta"><b style="color:var(--gold)">${inr(f.price)}</b></div><div class="ca"><button class="btn s" data-a="quick" data-id="${f.id}">Quick view</button><button class="btn s" data-a="wl" data-id="${f.id}" aria-label="Watchlist">${w?'Saved':'Save'}</button></div></div></div>`}
const row=(t,l)=>l.length?`<section class="row"><h2>${t}</h2><div class="sc">${l.map(card).join('')}</div></section>`:'';
function navr(){const u=me();const n=u?D.notes.filter(x=>x.u==u.id):[];const unread=n.filter(x=>!x.read).length;
H('#nr',u?`<div class="dd" id="nd"><button class="btn s" data-a="dd" aria-label="Notifications">Alerts${unread?' ('+unread+')':''}</button><div class="ddc">${n.slice(0,5).map(x=>`<div>${esc(x.m)}</div>`).join('')||'<div>No notifications yet</div>'}<a href="#/notifs">View all</a></div></div><div class="dd"><button class="btn s" data-a="dd">${esc(u.name.split(' ')[0])}</button><div class="ddc"><div style="color:var(--mu)">${u.role}</div><a href="#/dash">${u.role=='viewer'?'My dashboard':u.role=='filmmaker'?'Filmmaker studio':'Admin panel'}</a><a href="#/dash/profile">Profile</a><a href="#" data-a="out">Log out</a></div></div>`:`<a class="btn s" href="#/login">Log in</a><a class="btn p s" href="#/login/up">Sign up</a>`)}
function modal(h){closeM();const m=document.createElement('div');m.className='modal';m.id='md';m.innerHTML=`<div class="mc" role="dialog" aria-modal="true">${h}</div>`;m.onclick=e=>{if(e.target==m)closeM()};document.body.append(m)}
const closeM=()=>{$('#md')?.remove();stopAudio()};
/* ---------- player (simulated screening; audio is a soft tone so volume works) ---------- */
let AC,OSC,GAIN;const stopAudio=()=>{try{OSC?.stop();AC?.close()}catch(e){}OSC=AC=null};
function player(f,full){const dur=full?f.runtime*60:45;const key=(D.me||0)+'_'+f.id;const t0=full?(D.hist[key]?.t||0):0;
return`<div class="player" id="pl" data-d="${dur}" data-k="${key}" data-full="${full?1:0}"><div class="screen" style="--h:${f.hue}"><div><div class="meta" style="justify-content:center">${full?'Full film':'Trailer'}</div><h2>${esc(f.title)}</h2><div class="meta" style="justify-content:center">Dir. ${esc(f.director)}</div></div><div class="sub" id="sb"></div></div>
<div class="ctl"><button class="btn s p" id="pp">Play</button><span id="tm" style="min-width:90px">${fmt(t0)} / ${fmt(dur)}</span><input type="range" id="sk" min="0" max="${dur}" value="${t0}" aria-label="Timeline"><label style="margin:0">Vol</label><input type="range" id="vo" min="0" max="1" step=".05" value=".5" style="max-width:90px" aria-label="Volume"><select id="sp" aria-label="Speed"><option>0.5</option><option selected>1</option><option>1.5</option><option>2</option><option>10</option></select><button class="btn s" id="cc">Subtitles</button><button class="btn s" id="fs">Fullscreen</button></div></div>`}
function initPlayer(){const p=$('#pl');if(!p)return;const dur=+p.dataset.d,full=p.dataset.full=='1',k=p.dataset.k;let t=+$('#sk').value,play=0,subs=0;const L=['"We should have left before the rains."','"Some places remember everything."','"Tell them I was here."','"Not every ending needs a witness."'];
const upd=()=>{$('#tm').textContent=fmt(t)+' / '+fmt(dur);$('#sk').value=t;$('#sb').textContent=subs?L[Math.floor(t/8)%L.length]:'';if(full&&me()){D.hist[k]={t,ts:now(),f:+k.split('_')[1]};save()}};
const tone=()=>{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();OSC=AC.createOscillator();GAIN=AC.createGain();OSC.frequency.value=98;OSC.connect(GAIN).connect(AC.destination);GAIN.gain.value=$('#vo').value*.04;OSC.start()}};
const tick=setInterval(()=>{if(!play)return;t=Math.min(dur,t+.25*$('#sp').value);if(t>=dur){play=0;$('#pp').textContent='Replay';stopAudio();if(full)D.hist[k].t=0}upd()},250);timers.push(tick);
$('#pp').onclick=()=>{if(t>=dur)t=0;play=!play;$('#pp').textContent=play?'Pause':'Play';if(play){try{tone()}catch(e){}}else stopAudio()};
$('#sk').oninput=e=>{t=+e.target.value;upd()};$('#vo').oninput=e=>{if(GAIN)GAIN.gain.value=e.target.value*.04};
$('#cc').onclick=()=>{subs=!subs;upd()};$('#fs').onclick=()=>{(p.requestFullscreen||p.webkitRequestFullscreen).call(p)};
document.onkeydown=e=>{if(e.key=='Escape')closeM();if(e.target.tagName=='BODY'&&e.code=='Space'){e.preventDefault();$('#pp').click()}}}
/* ---------- pages ---------- */
